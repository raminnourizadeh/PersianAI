[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persian-enterprise-rag"
version = "0.1.0"
description = "A local-first Persian enterprise RAG and administrative assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.20,<1",
    "numpy>=2,<3",
    "requests>=2.32,<3",
    "torch>=2.5,<3",
    "pypdf>=5,<7",
    "qdrant-client>=1.13,<2",
    "sentence-transformers>=3,<6",
    "transformers>=4.48,<6",
    "hazm>=0.10,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
persian_rag = ["templates/*.html"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
